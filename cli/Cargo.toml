[package]
name = "fux"
version = "0.1.0"
edition = "2024"
description = "Native Rust CLI client for Fuxico / 0x0.st / rustypaste"

[[bin]]
name = "fux"
path = "src/main.rs"

[dependencies]
ureq = { version = "3.4", features = ["json"] }
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
