name: Build & Push CI Image

on:
  push:
    branches: ["main"]
    paths:
      - "docker/Dockerfile.ci"
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Build the PHP 8.4 + Rust CI image and push to Docker Hub.
  # Tagged as :latest and :php8.4 so ci.yml can reference a stable tag.
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: "Build & Push CI image"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.ci
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'lumenpink' }}/fuxico-ci:latest
            ${{ secrets.DOCKERHUB_USERNAME || 'lumenpink' }}/fuxico-ci:php8.4
