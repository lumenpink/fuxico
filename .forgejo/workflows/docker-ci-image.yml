name: Build & Push CI Image

on:
  push:
    branches: ["main"]
    paths:
      - "docker/Dockerfile.ci"
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Build the PHP 8.4 + Rust CI image and push to Docker Hub.
  # Tagged as :latest and :php8.4 so ci.yml can reference a stable tag.
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: "Build & Push CI image"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Docker Hub Credentials
        id: check-creds
        run: |
          if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ] && [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "has_creds=true" >> $GITHUB_OUTPUT
          else
            echo "::warning::DOCKERHUB_USERNAME/TOKEN not configured in repository secrets. Building without pushing."
            echo "has_creds=false" >> $GITHUB_OUTPUT
          fi

      - name: Log in to Docker Hub
        if: steps.check-creds.outputs.has_creds == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.ci
          push: ${{ steps.check-creds.outputs.has_creds == 'true' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'lumenpink' }}/fuxico-ci:latest
            ${{ secrets.DOCKERHUB_USERNAME || 'lumenpink' }}/fuxico-ci:php8.4
