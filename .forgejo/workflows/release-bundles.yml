name: Release Bundles

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CI_IMAGE: lumenpink/fuxico-ci:latest

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Standalone Server & Bash Client
  # ─────────────────────────────────────────────────────────────────────────────
  build-server-and-bash:
    name: "Build Server & Bash CLI"
    runs-on: ubuntu-latest
    container:
      image: ${{ env.CI_IMAGE }}
    steps:
      - name: "Checkout"
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Compile PHP server and package Bash CLI"
        run: |
          mkdir -p dist
          php compile.php --check
          cp bin/fux dist/fux
          chmod +x dist/fux

      - name: "Upload Server & Bash Artifacts"
        uses: https://github.com/actions/upload-artifact@v4
        with:
          name: server-and-bash
          path: |
            dist/fuxico.php
            dist/fux

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2 — Multi-Platform Native Rust Clients Matrix
  # ─────────────────────────────────────────────────────────────────────────────
  build-native-clients:
    name: "Build ${{ matrix.name }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            output: fux-linux-x86_64
            name: "Linux x86_64 (musl)"
          - target: aarch64-unknown-linux-musl
            output: fux-linux-aarch64
            name: "Linux ARM64 (musl)"
          - target: armv7-unknown-linux-musleabihf
            output: fux-linux-armv7
            name: "Linux ARMv7 (Orange/Banana Pi)"
          - target: arm-unknown-linux-musleabi
            output: fux-linux-armv6
            name: "Linux ARMv6 (Pi Zero/1)"
          - target: x86_64-pc-windows-gnu
            output: fux-windows-x86_64.exe
            name: "Windows x86_64"

    steps:
      - name: "Checkout"
        uses: https://github.com/actions/checkout@v4

      - name: "Install Rust Toolchain"
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: "Install Cross"
        run: |
          mkdir -p ~/.cargo/bin
          curl -sSL https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-musl.tar.gz | tar -xz -C ~/.cargo/bin
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: "Compile Native Binary via Cross"
        run: |
          mkdir -p dist
          cd cli
          cross build --release --target ${{ matrix.target }}
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            cp target/${{ matrix.target }}/release/fux.exe ../dist/${{ matrix.output }}
          else
            cp target/${{ matrix.target }}/release/fux ../dist/${{ matrix.output }}
            chmod +x ../dist/${{ matrix.output }}
          fi

      - name: "Upload Client Binary"
        uses: https://github.com/actions/upload-artifact@v4
        with:
          name: client-${{ matrix.output }}
          path: dist/${{ matrix.output }}

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3 — Consolidate & Publish Release
  # ─────────────────────────────────────────────────────────────────────────────
  publish-release:
    name: "Consolidate & Publish Release"
    runs-on: ubuntu-latest
    needs: [build-server-and-bash, build-native-clients]
    steps:
      - name: "Checkout"
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Download All Artifacts"
        uses: https://github.com/actions/download-artifact@v4
        with:
          path: artifacts

      - name: "Assemble dist/ and Checksums"
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          cd dist
          chmod +x fux fux-linux-* 2>/dev/null || true
          
          # Backward compatibility alias
          if [ -f fux-linux-x86_64 ]; then
            cp fux-linux-x86_64 fux-rs
            chmod +x fux-rs
          fi

          VERSION="$(head -n 1 ../VERSION 2>/dev/null | tr -d ' \r\n' || echo '0.1.0')"
          TARBALL="fuxico-${VERSION}.tar.gz"
          tar -czf "$TARBALL" fuxico.php fux fux-linux-x86_64 fux-rs
          sha256sum * > checksums.sha256
          ls -lh

      - name: "Upload Consolidated Artifacts"
        uses: https://github.com/actions/upload-artifact@v4
        with:
          name: fuxico-release-all
          path: dist/*

      - name: "Publish Release Assets"
        if: startsWith(github.ref, 'refs/tags/')
        uses: https://github.com/softprops/action-gh-release@v2
        with:
          files: |
            dist/fuxico.php
            dist/fux
            dist/fux-linux-*
            dist/fux-windows-*
            dist/checksums.sha256
            dist/*.tar.gz
