name: CI

on:
  push:
    branches: ["main", "develop"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "develop"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CI_IMAGE: lumenpink/gost-ci-php:latest

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Lint + Unit tests (PEST + Pint + Audit)
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: "PHP 8.4 — Tests & Lint"
    runs-on: ubuntu-latest
    container:
      image: gambi.2lp.in/lumen/gost-ci-php:latest

    steps:
      - name: "Checkout"
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Cache vendor"
        id: cache-vendor
        uses: https://github.com/actions/cache@v4
        with:
          path: |
            vendor
            .psalm-cache
          key: vendor-php8.4-${{ hashFiles('composer.lock') }}
          restore-keys: |
            vendor-php8.4-

      - name: "Install Composer dependencies"
        if: steps.cache-vendor.outputs.cache-hit != 'true'
        run: composer install --no-interaction --prefer-dist --no-progress

      # ── Security Audit ──────────────────────────────────────────────────────
      - name: "composer audit — Known vulnerabilities"
        run: composer audit --format=plain

      # ── Code Style (Deterministic: fmt --check) ─────────────────────────────
      - name: "Format Check (fmt --check)"
        run: ./vendor/bin/pint --test

      # ── Zero Warnings Enforcement (--strict) ────────────────────────────────
      # Static analysis and test assertion strictness: --strict

      # ── Fetch External Clients ──────────────────────────────────────────────
      - name: "Fetch Latest External Clients (rustypaste & 0x0.st)"
        run: ./scripts/fetch_external_clients.sh bin/.clients

      # ── PEST Tests + Coverage ───────────────────────────────────────────────
      - name: "PEST — Test Suite + Clover coverage"
        env:
          XDEBUG_MODE: coverage
        run: |
          mkdir -p coverage
          ./vendor/bin/pest \
            --coverage-clover coverage/clover.xml \
            --coverage-html coverage/html \
            --log-junit coverage/junit.xml

      # ── Step Summary ────────────────────────────────────────────────────────
      - name: "Publish Test Summary"
        if: always()
        run: php scripts/generate_ci_summary.php --step-summary

      # ── Audit Sovereign CD Workflow ─────────────────────────────────────────
      - name: "Audit Autonomous CD Workflow"
        run: bash tests/audit_cd_workflow.sh

      # ── Verify & Deploy Documentation Site + Reports to Pages ───────────────
      - name: "Verify Site Integrity"
        run: ./bin/verify-site.sh

      - name: "Deploy Documentation Site & Reports to Pages"
        if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          php scripts/generate_ci_summary.php --build-pages || true
          ./scripts/build_bundles.sh || true
          cp -r dist/* site/ 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin pages:pages 2>/dev/null || true
          if ! git rev-parse --verify pages >/dev/null 2>&1; then
            EMPTY_TREE=$(git hash-object -t tree /dev/null)
            FIRST_COMMIT=$(git commit-tree "$EMPTY_TREE" -m "Initialize pages branch")
            git branch pages "$FIRST_COMMIT"
          fi
          git worktree add /tmp/pages pages
          rm -rf /tmp/pages/*
          
          # Deploy full documentation site to root
          cp -r site/* /tmp/pages/

          # Keep CI reports available under /reports/
          if [ -d "public_reports" ]; then
            mkdir -p /tmp/pages/reports
            cp -r public_reports/* /tmp/pages/reports/
          fi

          cd /tmp/pages
          git add -A
          git commit -m "docs(site): deploy documentation to Codeberg Pages - $(date -u '+%Y-%m-%dT%H:%M:%SZ') [skip ci]" || echo "No changes to commit"
          git push origin pages || git push -f origin pages

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2 — Static security analysis with Psalm
  # ─────────────────────────────────────────────────────────────────────────────
  psalm:
    name: "Psalm — Static Security Analysis"
    runs-on: ubuntu-latest
    container:
      image: gambi.2lp.in/lumen/gost-ci-php:latest
    needs: test

    steps:
      - name: "Checkout"
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Cache vendor"
        id: cache-vendor
        uses: https://github.com/actions/cache@v4
        with:
          path: |
            vendor
            .psalm-cache
          key: vendor-php8.4-${{ hashFiles('composer.lock') }}
          restore-keys: |
            vendor-php8.4-

      - name: "Install dependencies"
        if: steps.cache-vendor.outputs.cache-hit != 'true'
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: "Psalm — Analysis (taints + errors)"
        run: |
          mkdir -p coverage
          ./vendor/bin/psalm \
            --config=psalm.xml \
            --taint-analysis \
            --report=coverage/psalm.json \
            --report-show-info=true \
            --no-progress \
            --output-format=github

      - name: "Publish Psalm Summary"
        if: always()
        run: php scripts/generate_ci_summary.php --step-summary

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3 — Security Auditing (Composer)
  # ─────────────────────────────────────────────────────────────────────────────
  security-audit:
    name: "Security Auditing (PHP)"
    runs-on: ubuntu-latest
    container:
      image: gambi.2lp.in/lumen/gost-ci-php:latest
    needs: test

    steps:
      - name: "Checkout"
        uses: https://github.com/actions/checkout@v4

      - name: "Cache vendor"
        uses: https://github.com/actions/cache@v4
        with:
          path: vendor
          key: vendor-php8.4-${{ hashFiles('composer.lock') }}

      - name: "Install Composer dependencies"
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: "composer audit — Known vulnerabilities (PHP)"
        run: composer audit --format=plain

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3b — CLI Check (Rust)
  # ─────────────────────────────────────────────────────────────────────────────
  rust-cli-check:
    name: "Rust CLI — Check"
    runs-on: ubuntu-latest
    container:
      image: gambi.2lp.in/lumen/gost-ci-rust:latest
    needs: test

    steps:
      - name: "Checkout"
        uses: https://github.com/actions/checkout@v4

      - name: "Cargo Check CLI"
        run: |
          cd cli
          cargo check

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 4 — SonarQube / SonarCloud Analysis
  # ─────────────────────────────────────────────────────────────────────────────
  sonarqube:
    name: "SonarQube Analysis"
    runs-on: ubuntu-latest
    needs: [test, psalm]
    if: github.actor != 'dependabot[bot]'
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: "Verify SONAR_TOKEN"
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::warning::SONAR_TOKEN not configured. Skipping SonarQube analysis."
          fi

      - uses: https://github.com/actions/checkout@v4
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0

      - name: "Restore coverage reports from Pages branch"
        if: env.SONAR_TOKEN != ''
        run: |
          mkdir -p coverage
          git fetch origin pages:pages 2>/dev/null || true
          git show pages:coverage/clover.xml > coverage/clover.xml 2>/dev/null || true
          [ -s coverage/clover.xml ] || rm -f coverage/clover.xml

      - name: "SonarQube / SonarCloud Scan"
        if: env.SONAR_TOKEN != ''
        uses: https://github.com/SonarSource/sonarqube-scan-action@v8.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY || 'lumenpink_fuxico' }}
            -Dsonar.organization=${{ vars.SONAR_ORG || 'lumenpink' }}
            -Dsonar.php.coverage.reportPaths=coverage/clover.xml

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 5 — Publish Static Documentation Site Bundle to Generic Packages
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-site:
    name: "Deploy Documentation Site"
    runs-on: ubuntu-latest
    container:
      image: gambi.2lp.in/lumen/gost-ci-php:latest
    needs: [test]
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.event_name == 'push'
    steps:
      - name: "Checkout repository"
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Verify Site Integrity & Links"
        run: |
          chmod +x bin/verify-site.sh
          ./bin/verify-site.sh

      - name: "Prepare Release Artifacts for Distribution"
        run: |
          # Copy standalone bash client to site root
          cp bin/fux site/fux
          chmod +x site/fux

          # Setup version endpoint
          head -n 1 VERSION 2>/dev/null | tr -d ' \r\n' > site/version || echo "0.1.0" > site/version

          # Compile portable server bundle if PHP is available
          if which php >/dev/null 2>&1; then
            php compile.php --check || true
            if [ -f dist/fuxico.php ]; then
              cp dist/fuxico.php site/fuxico.php
            fi
            php scripts/build_docs.php || true
          fi

      - name: "Publish Site Bundle to Forgejo Generic Packages"
        env:
          GAMBI_2LP_IN_TOKEN: ${{ secrets.REGISTRY_TOKEN || secrets.GAMBI_2LP_IN_TOKEN || secrets.FORGEJO_TOKEN || secrets.GIT_2LP_TOKEN }}
        run: |
          cccp package upload site

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 6 — Container Build, Push & Autonomous CD (obitwo)
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-deploy-docker:
    name: "Container — Build & Autonomous CD (obitwo)"
    runs-on: ubuntu-latest
    needs: [test]
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.event_name == 'push'
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME || 'lumenpink' }}/fuxico
    steps:
      - name: "Checkout repository"
        uses: https://github.com/actions/checkout@v4

      - name: "Check Docker Hub Credentials"
        id: check-creds
        run: |
          if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ] && [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "has_creds=true" >> $GITHUB_OUTPUT
          else
            echo "::warning::DOCKERHUB_USERNAME/TOKEN not configured in repository secrets. Building without pushing."
            echo "has_creds=false" >> $GITHUB_OUTPUT
          fi

      - name: "Log in to Docker Hub"
        if: steps.check-creds.outputs.has_creds == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "Extract metadata (tags, labels) for Docker"
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=ref,event=tag

      - name: "Build and push Docker image"
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: ${{ steps.check-creds.outputs.has_creds == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

