name: CI

on:
  push:
    branches: ["main", "develop"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "develop"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CI_IMAGE: lumenpink/indieinabox-ci:latest

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Lint + Unit tests (PEST + Pint + Audit)
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: "PHP 8.4 — Tests & Lint"
    runs-on: ubuntu-latest
    container:
      image: ${{ env.CI_IMAGE }}

    steps:
      - name: "Checkout"
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Cache vendor"
        id: cache-vendor
        uses: https://github.com/actions/cache@v4
        with:
          path: |
            vendor
            .psalm-cache
          key: vendor-php8.4-${{ hashFiles('composer.lock') }}
          restore-keys: |
            vendor-php8.4-

      - name: "Install Composer dependencies"
        if: steps.cache-vendor.outputs.cache-hit != 'true'
        run: composer install --no-interaction --prefer-dist --no-progress

      # ── Security Audit ──────────────────────────────────────────────────────
      - name: "composer audit — Known vulnerabilities"
        run: composer audit --format=plain

      # ── Code Style (Pint) ───────────────────────────────────────────────────
      - name: "Laravel Pint — Code Style"
        run: ./vendor/bin/pint --test

      # ── PEST Tests + Coverage ───────────────────────────────────────────────
      - name: "PEST — Test Suite + Clover coverage"
        env:
          XDEBUG_MODE: coverage
        run: |
          mkdir -p coverage
          ./vendor/bin/pest \
            --coverage-clover coverage/clover.xml \
            --coverage-html coverage/html \
            --log-junit coverage/junit.xml

      # ── Step Summary ────────────────────────────────────────────────────────
      - name: "Publish Test Summary"
        if: always()
        run: php scripts/generate_ci_summary.php --step-summary

      # ── Deploy Coverage Dashboard to Pages ─────────────────────────────────
      - name: "Deploy Coverage Dashboard to Pages"
        if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          php scripts/generate_ci_summary.php --build-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin pages:pages 2>/dev/null || true
          if ! git rev-parse --verify pages >/dev/null 2>&1; then
            EMPTY_TREE=$(git hash-object -t tree /dev/null)
            FIRST_COMMIT=$(git commit-tree "$EMPTY_TREE" -m "Initialize pages branch")
            git branch pages "$FIRST_COMMIT"
          fi
          git worktree add /tmp/pages pages
          rm -rf /tmp/pages/*
          cp -r public_reports/* /tmp/pages/
          cd /tmp/pages
          git add -A
          git commit -m "Deploy CI reports dashboard - $(date -u '+%Y-%m-%dT%H:%M:%SZ')" || echo "No changes to commit"
          git push origin pages || git push -f origin pages

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2 — Static security analysis with Psalm
  # ─────────────────────────────────────────────────────────────────────────────
  psalm:
    name: "Psalm — Static Security Analysis"
    runs-on: ubuntu-latest
    container:
      image: ${{ env.CI_IMAGE }}
    needs: test

    steps:
      - name: "Checkout"
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Cache vendor"
        id: cache-vendor
        uses: https://github.com/actions/cache@v4
        with:
          path: |
            vendor
            .psalm-cache
          key: vendor-php8.4-${{ hashFiles('composer.lock') }}
          restore-keys: |
            vendor-php8.4-

      - name: "Install dependencies"
        if: steps.cache-vendor.outputs.cache-hit != 'true'
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: "Psalm — Analysis (taints + errors)"
        run: |
          mkdir -p coverage
          ./vendor/bin/psalm \
            --config=psalm.xml \
            --taint-analysis \
            --report=coverage/psalm.json \
            --report-show-info=true \
            --no-progress \
            --output-format=github

      - name: "Publish Psalm Summary"
        if: always()
        run: php scripts/generate_ci_summary.php --step-summary

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3 — OWASP Dependency-Check
  # ─────────────────────────────────────────────────────────────────────────────
  dependency-check:
    name: "OWASP Dependency-Check"
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: https://github.com/actions/checkout@v4

      - name: "Get week (NVD cache key)"
        id: week
        run: echo "week=$(date +%Y-%W)" >> $GITHUB_OUTPUT

      - name: "Cache NVD data"
        uses: https://github.com/actions/cache@v4
        with:
          path: ~/.dependency-check/data
          key: nvd-${{ steps.week.outputs.week }}
          restore-keys: |
            nvd-

      - name: "Run OWASP Dependency-Check"
        uses: https://github.com/dependency-check/Dependency-Check_Action@v1.1.0
        id: depcheck
        with:
          project: "fuxico"
          path: "."
          format: "HTML SARIF"
          out: "coverage/dependency-check"
          args: >
            --failOnCVSS 7
            --enableRetired
            --exclude "**/vendor/**"
            --exclude "**/cli/target/**"

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 4 — SonarQube / SonarCloud Analysis
  # ─────────────────────────────────────────────────────────────────────────────
  sonarqube:
    name: "SonarQube Analysis"
    runs-on: ubuntu-latest
    needs: [test, psalm]
    if: github.actor != 'dependabot[bot]'
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: "Verify SONAR_TOKEN"
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::warning::SONAR_TOKEN not configured. Skipping SonarQube analysis."
          fi

      - uses: https://github.com/actions/checkout@v4
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0

      - name: "Restore coverage reports from Pages branch"
        if: env.SONAR_TOKEN != ''
        run: |
          mkdir -p coverage
          git fetch origin pages:pages 2>/dev/null || true
          git show pages:coverage/clover.xml > coverage/clover.xml 2>/dev/null || true
          [ -s coverage/clover.xml ] || rm -f coverage/clover.xml

      - name: "SonarQube / SonarCloud Scan"
        if: env.SONAR_TOKEN != ''
        uses: https://github.com/SonarSource/sonarqube-scan-action@v8.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY || 'lumenpink_fuxico' }}
            -Dsonar.organization=${{ vars.SONAR_ORG || 'lumenpink' }}
            -Dsonar.php.coverage.reportPaths=coverage/clover.xml
