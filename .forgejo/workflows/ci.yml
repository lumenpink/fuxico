name: CI

on:
  push:
    branches: ["main", "develop"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "develop"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CI_IMAGE: codeberg.org/lumenpink/gost-ci-php:latest

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Lint + Unit tests (PEST + Pint + Audit)
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: "PHP 8.4 — Tests & Lint"
    runs-on: ubuntu-latest
    container:
      image: codeberg.org/lumenpink/gost-ci-php:latest

    steps:
      - name: "Checkout"
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Cache vendor"
        id: cache-vendor
        uses: https://github.com/actions/cache@v4
        with:
          path: |
            vendor
            .psalm-cache
          key: vendor-php8.4-${{ hashFiles('composer.lock') }}
          restore-keys: |
            vendor-php8.4-

      - name: "Install Composer dependencies"
        if: steps.cache-vendor.outputs.cache-hit != 'true'
        run: composer install --no-interaction --prefer-dist --no-progress

      # ── Security Audit ──────────────────────────────────────────────────────
      - name: "composer audit — Known vulnerabilities"
        run: composer audit --format=plain

      # ── Code Style (Pint) ───────────────────────────────────────────────────
      - name: "Laravel Pint — Code Style"
        run: ./vendor/bin/pint --test

      # ── Fetch External Clients ──────────────────────────────────────────────
      - name: "Fetch Latest External Clients (rustypaste & 0x0.st)"
        run: ./scripts/fetch_external_clients.sh bin/.clients

      # ── PEST Tests + Coverage ───────────────────────────────────────────────
      - name: "PEST — Test Suite + Clover coverage"
        env:
          XDEBUG_MODE: coverage
        run: |
          mkdir -p coverage
          ./vendor/bin/pest \
            --coverage-clover coverage/clover.xml \
            --coverage-html coverage/html \
            --log-junit coverage/junit.xml

      # ── Step Summary ────────────────────────────────────────────────────────
      - name: "Publish Test Summary"
        if: always()
        run: php scripts/generate_ci_summary.php --step-summary

      # ── Verify & Deploy Documentation Site + Reports to Pages ───────────────
      - name: "Verify Site Integrity"
        run: ./bin/verify-site.sh

      - name: "Deploy Documentation Site & Reports to Pages"
        if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          php scripts/generate_ci_summary.php --build-pages || true
          ./scripts/build_bundles.sh || true
          cp -r dist/* site/ 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin pages:pages 2>/dev/null || true
          if ! git rev-parse --verify pages >/dev/null 2>&1; then
            EMPTY_TREE=$(git hash-object -t tree /dev/null)
            FIRST_COMMIT=$(git commit-tree "$EMPTY_TREE" -m "Initialize pages branch")
            git branch pages "$FIRST_COMMIT"
          fi
          git worktree add /tmp/pages pages
          rm -rf /tmp/pages/*
          
          # Deploy full documentation site to root
          cp -r site/* /tmp/pages/

          # Keep CI reports available under /reports/
          if [ -d "public_reports" ]; then
            mkdir -p /tmp/pages/reports
            cp -r public_reports/* /tmp/pages/reports/
          fi

          cd /tmp/pages
          git add -A
          git commit -m "docs(site): deploy documentation to Codeberg Pages - $(date -u '+%Y-%m-%dT%H:%M:%SZ') [skip ci]" || echo "No changes to commit"
          git push origin pages || git push -f origin pages

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2 — Static security analysis with Psalm
  # ─────────────────────────────────────────────────────────────────────────────
  psalm:
    name: "Psalm — Static Security Analysis"
    runs-on: ubuntu-latest
    container:
      image: codeberg.org/lumenpink/gost-ci-php:latest
    needs: test

    steps:
      - name: "Checkout"
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Cache vendor"
        id: cache-vendor
        uses: https://github.com/actions/cache@v4
        with:
          path: |
            vendor
            .psalm-cache
          key: vendor-php8.4-${{ hashFiles('composer.lock') }}
          restore-keys: |
            vendor-php8.4-

      - name: "Install dependencies"
        if: steps.cache-vendor.outputs.cache-hit != 'true'
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: "Psalm — Analysis (taints + errors)"
        run: |
          mkdir -p coverage
          ./vendor/bin/psalm \
            --config=psalm.xml \
            --taint-analysis \
            --report=coverage/psalm.json \
            --report-show-info=true \
            --no-progress \
            --output-format=github

      - name: "Publish Psalm Summary"
        if: always()
        run: php scripts/generate_ci_summary.php --step-summary

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3 — Security Auditing (Composer)
  # ─────────────────────────────────────────────────────────────────────────────
  security-audit:
    name: "Security Auditing (PHP)"
    runs-on: ubuntu-latest
    container:
      image: codeberg.org/lumenpink/gost-ci-php:latest
    needs: test

    steps:
      - name: "Checkout"
        uses: https://github.com/actions/checkout@v4

      - name: "Cache vendor"
        uses: https://github.com/actions/cache@v4
        with:
          path: vendor
          key: vendor-php8.4-${{ hashFiles('composer.lock') }}

      - name: "Install Composer dependencies"
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: "composer audit — Known vulnerabilities (PHP)"
        run: composer audit --format=plain

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3b — CLI Check (Rust)
  # ─────────────────────────────────────────────────────────────────────────────
  rust-cli-check:
    name: "Rust CLI — Check"
    runs-on: ubuntu-latest
    container:
      image: codeberg.org/lumenpink/gost-ci-rust:latest
    needs: test

    steps:
      - name: "Checkout"
        uses: https://github.com/actions/checkout@v4

      - name: "Cargo Check CLI"
        run: |
          cd cli
          cargo check

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 4 — SonarQube / SonarCloud Analysis
  # ─────────────────────────────────────────────────────────────────────────────
  sonarqube:
    name: "SonarQube Analysis"
    runs-on: ubuntu-latest
    needs: [test, psalm]
    if: github.actor != 'dependabot[bot]'
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: "Verify SONAR_TOKEN"
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::warning::SONAR_TOKEN not configured. Skipping SonarQube analysis."
          fi

      - uses: https://github.com/actions/checkout@v4
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0

      - name: "Restore coverage reports from Pages branch"
        if: env.SONAR_TOKEN != ''
        run: |
          mkdir -p coverage
          git fetch origin pages:pages 2>/dev/null || true
          git show pages:coverage/clover.xml > coverage/clover.xml 2>/dev/null || true
          [ -s coverage/clover.xml ] || rm -f coverage/clover.xml

      - name: "SonarQube / SonarCloud Scan"
        if: env.SONAR_TOKEN != ''
        uses: https://github.com/SonarSource/sonarqube-scan-action@v8.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY || 'lumenpink_fuxico' }}
            -Dsonar.organization=${{ vars.SONAR_ORG || 'lumenpink' }}
            -Dsonar.php.coverage.reportPaths=coverage/clover.xml

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 5 — Deploy Static Documentation Site (Cloudflare + Codeberg Fallback)
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-site:
    name: "Deploy Documentation Site"
    runs-on: ubuntu-latest
    needs: [test]
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.event_name == 'push'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME || 'fuxico' }}
    steps:
      - name: "Checkout repository"
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Verify Site Integrity & Links"
        run: |
          chmod +x bin/verify-site.sh
          ./bin/verify-site.sh

      - name: "Prepare Release Artifacts for Distribution"
        run: |
          # Copy standalone bash client to site root
          cp bin/fux site/fux
          chmod +x site/fux

          # Setup version endpoint
          head -n 1 VERSION 2>/dev/null | tr -d ' \r\n' > site/version || echo "0.1.0" > site/version

          # Compile portable server bundle if PHP is available
          if which php >/dev/null 2>&1; then
            php compile.php --check || true
            if [ -f dist/fuxico.php ]; then
              cp dist/fuxico.php site/fuxico.php
            fi
          fi

      - name: "Deploy to Cloudflare Workers (fuxico.2lp.in)"
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Cloudflare credentials (CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID) not configured in repository secrets. Skipping Cloudflare deployment."
          else
            echo "Publishing static documentation site via Cloudflare Workers..."
            npx wrangler deploy || echo "::warning::Cloudflare deployment exited with status $?. Continuing with redundancy deployment."
          fi

      - name: "Deploy to Codeberg Pages (Fallback Redundancy)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "actions-user"
          git config user.email "actions@codeberg.org"

          WORKTREE_DIR=$(mktemp -d)
          if git ls-remote --exit-code --heads origin pages >/dev/null 2>&1; then
            git fetch origin pages:pages
            git worktree add "$WORKTREE_DIR" pages
          else
            git worktree add --orphan -b pages "$WORKTREE_DIR"
          fi

          # Preserve coverage directory if it exists on pages
          if [ -d "$WORKTREE_DIR/coverage" ]; then
            cp -r "$WORKTREE_DIR/coverage" /tmp/coverage-backup
          fi

          rm -rf "${WORKTREE_DIR:?}"/*
          cp -r site/* "$WORKTREE_DIR/"

          # Restore coverage directory
          if [ -d /tmp/coverage-backup ]; then
            mkdir -p "$WORKTREE_DIR/coverage"
            cp -r /tmp/coverage-backup/* "$WORKTREE_DIR/coverage/"
          fi

          cd "$WORKTREE_DIR"
          # Ensure no CNAME in Codeberg Pages branch to avoid hijacking custom domain
          rm -f CNAME
          git add -A
          if git diff --staged --quiet; then
            echo "No documentation changes to deploy to Codeberg Pages."
          else
            git commit -m "docs(site): deploy documentation to Codeberg Pages [skip ci]"
            git push origin pages
            echo "Successfully deployed documentation to Codeberg Pages."
          fi
          cd - >/dev/null
          git worktree remove "$WORKTREE_DIR" --force || true
