services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: lumenpink/fuxico:latest
    container_name: fuxico
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - FUXICO_PUBLIC_MODE=${FUXICO_PUBLIC_MODE:-${PICOSHARE_PUBLIC_MODE:-false}}
      - FUXICO_AUTH_TOKENS=${FUXICO_AUTH_TOKENS:-${PICOSHARE_AUTH_TOKENS:-tatanka}}
      - FUXICO_BASE_URL=${FUXICO_BASE_URL:-${PICOSHARE_BASE_URL:-}}
      - FUXICO_MAX_UPLOAD_SIZE=${FUXICO_MAX_UPLOAD_SIZE:-${PICOSHARE_MAX_UPLOAD_SIZE:-524288000}}
      - FUXICO_DATA_DIR=/data
    volumes:
      - ./data:/data
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    image: containrrr/watchtower:latest
    container_name: fuxico_watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=86400
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
